<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CloudHost - 서버 상품 신청</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; background-color: #f4f6fb; color: #333; min-height: 100vh; }

        /* GNB */
        .navbar { background: #1a237e; color: white; padding: 14px 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 800; text-decoration: none; color: white; }
        .logo span { color: #82b1ff; }
        .user-info { font-size: 14px; color: #e0e4ff; }
        .user-info strong { color: #82b1ff; }
        .logout-btn { margin-left: 14px; color: #ff8a80; text-decoration: none; font-weight: 700; font-size: 13px; }

        /* 컨테이너 및 탭메뉴 */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 24px; }
        .tab-menu { display: flex; gap: 8px; border-bottom: 2px solid #e2e8f0; padding-bottom: 0; margin-bottom: 36px; }
        .tab-item { display: block; padding: 12px 20px; font-size: 16px; font-weight: 700; color: #64748b; text-decoration: none; position: relative; transition: all 0.2s; }
        .tab-item:hover { color: #1a237e; }
        .tab-item.active { color: #1a237e; }
        .tab-item.active::after { content: ""; position: absolute; bottom: -2px; left: 0; right: 0; height: 3px; background-color: #1a237e; border-radius: 3px 3px 0 0; }

        .page-title-section { margin-bottom: 24px; }
        .page-title-section h1 { font-size: 24px; font-weight: 800; color: #1a237e; }

        /* 통합 패키지 카드 */
        .package-card { background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(26,35,126,0.06); border-top: 6px solid #1a237e; overflow: hidden; margin-bottom: 30px; }
        .package-header { padding: 32px; background: linear-gradient(135deg, #1a237e, #1565c0); color: white; }
        .package-badge { display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 800; background-color: #82b1ff; color: #1a237e; margin-bottom: 12px; }
        .package-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        .package-desc { font-size: 14px; opacity: 0.9; line-height: 1.6; }

        .package-body { padding: 32px; display: flex; gap: 24px; background-color: #ffffff; }
        .sub-component { flex: 1; background-color: #f8fafc; border-radius: 12px; padding: 24px; border: 1px solid #e2e8f0; }
        .sub-component.web-box { border-left: 4px solid #1565c0; }
        .sub-component.db-box { border-left: 4px solid #2e7d32; }

        .comp-title { font-size: 16px; font-weight: 800; color: #1565c0; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .comp-title.db-title { color: #2e7d32; }

        /* 📍 폼 입력 항목 레이아웃 */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 8px; background-color: white; color: #333; transition: border 0.15s; }
        .form-control:focus { border-color: #1a237e; outline: none; }
        .form-control::placeholder { color: #94a3b8; font-size: 13px; }

        /* 스펙 변경 드롭다운 전용 */
        .config-select { width: 100%; padding: 10px 12px; font-size: 13px; font-weight: 600; border: 1px solid #cbd5e1; border-radius: 8px; background-color: #fff; color: #0f172a; cursor: pointer; }

        /* 구분선 */
        .divider { height: 1px; background: #e2e8f0; margin: 20px 0; }

        /* 푸터 하단 요금표 */
        .package-footer { padding: 24px 32px; background-color: #f1f5f9; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e2e8f0; }
        .price-info { text-align: left; }
        .price-label { font-size: 13px; color: #64748b; margin-bottom: 2px; }
        .price-value { font-size: 26px; font-weight: 800; color: #1a237e; }
        .price-value span { font-size: 14px; font-weight: 500; color: #64748b; }

        .btn-submit { padding: 14px 40px; background-color: #1a237e; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(26,35,126,0.2); }
        .btn-submit:hover { background-color: #1565c0; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/dashboard" class="logo">☁️ Cloud<span>Host</span></a>
    <div class="user-info">
        <strong><span th:text="${username}">테스트유저</span></strong>님 로그인 중
        <a href="/logout" class="logout-btn">로그아웃</a>
    </div>
</nav>

<div class="container">

    <div class="tab-menu">
        <a href="/dashboard" class="tab-item">🏠 대시보드 홈</a>
        <a href="/servers/shop" class="tab-item active">🛒 서버 상품 신청</a>
        <a href="/servers/my" class="tab-item">💻 내 가상 서버 관리</a>
    </div>

    <div class="page-title-section">
        <h1>통합 서버 패키지 신청</h1>
    </div>

    <form action="/servers/order" method="POST">
        <input type="hidden" name="productPackage" value="INTEGRATED_FULL_STACK">

        <div class="package-card">
            <div class="package-header">
                <span class="package-badge">FLOW SYSTEM INTEGRATION</span>
                <h2 class="package-title">Web & DB 풀스택 통합 빌드 자동화</h2>
                <p class="package-desc">스토리보드에 정의된 웹서버 및 데이터베이스 신청 설정을 한 번에 입력하여 가상 인프라 스택을 원클릭으로 일괄 자동 구동합니다.</p>
            </div>

            <div class="package-body">

                <div class="sub-component web-box">
                    <h3 class="comp-title">🖥️ 웹 서버 설정 (Component 01)</h3>

                    <div class="form-group">
                        <label>웹 서버 이름</label>
                        <input type="text" name="webName" class="form-control" placeholder="예시) user-web-001" required>
                    </div>

                    <div class="form-group">
                        <label>웹 서버 설명</label>
                        <input type="text" name="webDesc" class="form-control" placeholder="웹 인프라에 대한 용도 설명">
                    </div>

                    <div class="form-group">
                        <label>운영체제(OS)</label>
                        <input type="text" class="form-control" value="Ubuntu 24.04 LTS (고정)" disabled style="background:#e2e8f0; color:#64748b;">
                    </div>

                    <div class="divider"></div>

                    <div class="form-group">
                        <label>CPU 스펙 확장</label>
                        <select name="webCpu" class="config-select" onchange="updatePrice()">
                            <option value="2" data-price="0">vCPU 2 Cores (기본)</option>
                            <option value="4" data-price="10000">vCPU 4 Cores (+10,000원)</option>
                            <option value="8" data-price="25000">vCPU 8 Cores (+25,000원)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>메모리(RAM) 확장</label>
                        <select name="webRam" class="config-select" onchange="updatePrice()">
                            <option value="4" data-price="0">4 GB (기본)</option>
                            <option value="8" data-price="12000">8 GB (+12,000원)</option>
                            <option value="16" data-price="28000">16 GB (+28,000원)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>스토리지(SSD) 확장</label>
                        <select name="webStorage" class="config-select" onchange="updatePrice()">
                            <option value="50" data-price="0">50 GB (기본)</option>
                            <option value="100" data-price="5000">100 GB (+5,000원)</option>
                            <option value="200" data-price="15000">200 GB (+15,000원)</option>
                        </select>
                    </div>
                </div>

                <div class="sub-component db-box">
                    <h3 class="comp-title db-title">🗄️ 데이터베이스 설정 (Component 02)</h3>

                    <div class="form-group">
                        <label>DB 서버 이름</label>
                        <input type="text" name="dbName" class="form-control" placeholder="예시) user-db-001" required>
                    </div>

                    <div class="form-group">
                        <label>생성할 Database 이름</label>
                        <input type="text" name="dbSchemaName" class="form-control" placeholder="예시) myapp_db" required>
                    </div>

                    <div class="form-group">
                        <label>DB 사용자명(Username)</label>
                        <input type="text" name="dbUser" class="form-control" placeholder="예시) user01" required>
                    </div>

                    <div class="form-group">
                        <label>DB 비밀번호(Password)</label>
                        <input type="password" name="dbPassword" class="form-control" placeholder="DB 접속 패스워드 입력" required>
                    </div>

                    <div class="divider"></div>

                    <div class="form-group">
                        <label>CPU 스펙 확장</label>
                        <select name="dbCpu" class="config-select" onchange="updatePrice()">
                            <option value="2" data-price="0">vCPU 2 Cores (기본)</option>
                            <option value="4" data-price="10000">vCPU 4 Cores (+10,000원)</option>
                            <option value="8" data-price="25000">vCPU 8 Cores (+25,000원)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>메모리(RAM) 확장</label>
                        <select name="dbRam" class="config-select" onchange="updatePrice()">
                            <option value="4" data-price="0">4 GB (기본)</option>
                            <option value="8" data-price="12000">8 GB (+12,000원)</option>
                            <option value="16" data-price="28000">16 GB (+28,000원)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>스토리지(SSD) 확장</label>
                        <select name="dbStorage" class="config-select" onchange="updatePrice()">
                            <option value="100" data-price="0">100 GB (기본)</option>
                            <option value="200" data-price="10000">200 GB (+10,000원)</option>
                            <option value="500" data-price="30000">500 GB (+30,000원)</option>
                        </select>
                    </div>
                </div>

            </div>

            <div class="package-footer">
                <div class="price-info">
                    <p class="price-label">Web + DB 통합 패키지 결제 예정 금액</p>
                    <p class="price-value">₩<span id="total-price-display">45,000</span> <span>/ 월</span></p>
                </div>
                <button type="submit" class="btn-submit">🚀 통합 인프라 패키지 생성 자동화 실행</button>
            </div>
        </div>
    </form>
</div>

<script>
    function updatePrice() {
        const basePrice = 45000;
        let additionalPrice = 0;

        const selects = document.querySelectorAll('.config-select');
        selects.forEach(select => {
            const selectedOption = select.options[select.selectedIndex];
            const price = parseInt(selectedOption.getAttribute('data-price')) || 0;
            additionalPrice += price;
        });

        const totalPrice = basePrice + additionalPrice;
        document.getElementById('total-price-display').innerText = totalPrice.toLocaleString();
    }
</script>

</body>
</html>

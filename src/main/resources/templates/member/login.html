<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 — CloudHost</title>
    <link rel="stylesheet" th:href="@{/css/common/layout.css}">
    <link rel="stylesheet" th:href="@{/css/common/navbar.css}">

    <link rel="stylesheet" th:href="@{/css/member/member.css}">
</head>
<body>
<nav class="navbar">
    <a th:href="@{/}" class="logo">☁️ Cloud<span>Host</span></a>
</nav>
<div class="wrap">
    <div class="card">
        <h2>로그인</h2>
        <p class="sub">CloudHost에 오신 것을 환영합니다</p>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>아이디</label>
                <input type="text" name="username" class="form-control" placeholder="아이디 입력" />
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" name="password" class="form-control" placeholder="비밀번호 입력" />
            </div>
            <button type="submit" class="btn btn-primary"
                    style="width:100%;padding:13px;font-size:15px;margin-top:4px">
                로그인
            </button>
        </form>

        <div class="divider"></div>
        <p style="text-align:center;font-size:13px;color:#888">
            계정이 없으신가요?
            <a th:href="@{/signup}" style="color:#1565c0;font-weight:700">회원가입</a>
        </p>
    </div>
</div>
</body>
</html>

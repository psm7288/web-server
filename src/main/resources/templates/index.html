<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>CloudHost</title>
    <link rel="stylesheet" th:href="@{/css/common/layout.css}">
    <link rel="stylesheet" th:href="@{/css/common/navbar.css}">

    <link rel="stylesheet" th:href="@{/css/pages/index.css}">
</head>
<body>
<nav class="navbar">
    <div class="logo">☁️ Cloud<span>Host</span></div>
    <div class="nav-links">
        <sec:authorize access="isAnonymous()">
            <a th:href="@{/login}"><button class="btn btn-outline">로그인</button></a>
            <a th:href="@{/signup}"><button class="btn btn-accent">회원가입</button></a>
        </sec:authorize>
    </div>
</nav>

<div class="hero">
    <h1>OpenStack 기반<br><span>웹호스팅 서비스</span></h1>
    <p>웹서버와 MariaDB를 클릭 한 번으로 자동 생성하세요<br>Private Cloud 기반의 안정적인 호스팅 플랫폼</p>
    <div class="hero-btns">
        <a th:href="@{/signup}" class="hero-btn-p">서비스 시작하기</a>
        <a th:href="@{/login}"  class="hero-btn-s">로그인</a>
    </div>
</div>

<div class="features">
    <div class="feat">
        <div class="icon">🖥️</div>
        <h3>웹서버 자동 생성</h3>
        <p>Ubuntu 24.04 + Spring Boot<br>자동 설치 및 배포</p>
    </div>
    <div class="feat g">
        <div class="icon">🗄️</div>
        <h3>DB 서버 자동 생성</h3>
        <p>MariaDB 자동 설치<br>DB · 계정 자동 구성</p>
    </div>
    <div class="feat p">
        <div class="icon">📊</div>
        <h3>실시간 상태 확인</h3>
        <p>서버 생성 진행 상황<br>대시보드에서 모니터링</p>
    </div>
</div>
</body>
</html>

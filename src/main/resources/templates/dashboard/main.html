<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CloudHost - 대시보드 홈</title>
    <link rel="stylesheet" th:href="@{/css/pages/main.css}">
    <link rel="stylesheet" th:href="@{/css/common/layout.css}">
    <link rel="stylesheet" th:href="@{/css/common/navbar.css}">
</head>
<body>

<div class="navbar">
    <a href="/dashboard" class="logo">☁️ Cloud<span>Host</span></a>
    <div class="user-info">
        <strong><span th:text="${username}">테스트유저</span></strong>님 로그인 중
        <a href="/logout" class="logout-btn">로그아웃</a>
    </div>
</div>

<div class="container">
    <div class="tab-menu">
        <a href="/dashboard" class="tab-item active">🏠 대시보드 홈</a>
        <a href="/servers/shop" class="tab-item">🛒 서버 상품 신청</a>
        <a href="/servers/my" class="tab-item">💻 내 가상 서버 관리</a>
    </div>

    <h2 class="page-title">대시보드 홈</h2>

    <div class="summary-box">
        <h3>운영 중인 가상 서버 패키지</h3>
        <div class="count"><span th:text="${serverCount}">0</span> 세트</div>
    </div>

    <div class="section-title">🛡️ 최근 할당 및 가동 인프라 신청 내역</div>

    <div class="empty-message" th:if="${#lists.isEmpty(myServers)}">
        현재 운영 중이거나 신청된 가상 서버 인프라가 존재하지 않습니다.
    </div>

    <table th:unless="${#lists.isEmpty(myServers)}">
        <thead>
        <tr>
            <th>주문 식별 ID</th>
            <th>WEB 서버 명칭</th>
            <th>DB 스키마 스페이스</th>
            <th>인프라 할당 상태</th>
            <th>신청 등록 일시</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${myServers}">
            <td><strong th:text="|PKG-${order.requestId}|">PKG-1</strong></td>

            <td th:text="${order.webServerName}">user-web-01</td>

            <td th:text="${order.dbName}">main_schema</td>

            <td>
                <span th:if="${order.status == 'PENDING'}" class="badge badge-pending">PENDING (대기중)</span>
                <span th:if="${order.status == 'RUNNING'}" class="badge badge-running">RUNNING (구동중)</span>
            </td>

            <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-05-26 12:00:00</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
